name: NFL Daily Forecast

on:
  schedule:
    # 8 AM UTC daily. NFL games are mostly Thu/Sun/Mon; running daily is
    # harmless on off-days since get_todays_games() just returns an empty
    # list and the script exits cleanly with a WARNING log, no failure.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools<81 keeps pkg_resources available - some of
          # nfl_data_py's own install-time tooling expects it (confirmed
          # necessary during build/testing on Python 3.12).
          pip install "setuptools<81"
          # Install pandas/numpy/fastparquet/appdirs WITH their normal
          # dependencies first (python-dateutil, etc. are required, not
          # optional - confirmed by a real install failure during testing
          # when --no-deps was applied too broadly).
          pip install -r requirements.txt
          # THEN install nfl_data_py separately, with --no-deps, so pip
          # doesn't try to downgrade the pandas/numpy already installed
          # above to satisfy nfl_data_py's own stale pandas<2.0/numpy<2.0
          # pin (confirmed at build time: nfl_data_py works fine against
          # modern pandas/numpy despite that pin).
          pip install nfl_data_py==0.3.3 --no-deps

      - name: Run forecast script
        run: python predict_nfl.py

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
